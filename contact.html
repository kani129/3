<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WEB予約フォーム</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        padding: 20px;
      }
      form {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        max-width: 400px;
        margin: auto;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
      }
      input,
      select,
      textarea,
      button {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        background-color: #28a745;
        color: white;
        border: none;
        margin-top: 15px;
        cursor: pointer;
      }
      button:hover {
        background-color: #218838;
      }
    </style>
  </head>
  <body>
    <h2>WEB予約フォーム</h2>

    <form action="submit.php" method="post">
      <label for="name">お名前 <span style="color: red">*</span></label>
      <input type="text" id="name" name="name" required />

      <label for="email"
        >メールアドレス <span style="color: red">*</span></label
      >
      <input type="email" id="email" name="email" required />

      <label for="phone">電話番号</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        pattern="[0-9]{2,4}-?[0-9]{2,4}-?[0-9]{3,4}"
        placeholder="例: 090-1234-5678"
      />

      <label for="date">予約日 <span style="color: red">*</span></label>
      <input type="date" id="date" name="date" required />

      <label for="time">予約時間 <span style="color: red">*</span></label>
      <input type="time" id="time" name="time" required />

      <label for="service">サービス内容</label>
      <select id="service" name="service">
        <option value="consultation">相談</option>
        <option value="lesson">レッスン</option>
        <option value="other">その他</option>
      </select>

      <label for="message">備考</label>
      <textarea id="message" name="message" rows="4"></textarea>

      <button type="submit">予約する</button>
    </form>
  </body>
</html>
